[package]
name = "ginger-code"
version = "0.1.0"
edition = "2021"
default-run = "ginger-code-cli"
description = "ginger code "


[[bin]]
name = "ginger-code"
path = "src/main.rs"

[[bin]]
name = "ginger-code-cli"
path = "src/bin/cli.rs"


[dependencies]
serde = { version = "1", features = ["derive"] }
toml        = "0.7"
serde_json  = "1"
indexmap    = "2"
libc        = "0.2"
clap        = { version = "4", features = ["derive", "env"] }
MetadataService = { path = "./MetadataService_client" }
ginger-shared-rs = {version = "0.51.0-nightly.0", organization = "ginger-society"}
IAMService = { path = "./IAMService_client" }
tokio = {version = "1", features = ["full"]}
tokio-util = { version = "=0.7.4", features = ["compat", "time", "rt"] }
ratatui = "0.26"
crossterm = "0.27"
dirs = "6.0.0"
tray-icon = "0.19"          # cross-platform tray icon (Windows, macOS, Linux/GTK)
resvg    = "0.44"
winit = { version = "0.30", features = [] }
eframe        = { version = "0.27", features = ["default"] }
egui          = "0.27"
portable-pty  = "0.8"
vte           = "0.13"
parking_lot   = "0.12"
image = { version = "0.24", default-features = false, features = ["png"] }
ctrlc = { version = "3", features = ["termination"] }
syntect = { version = "=5.2.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "html",
    "regex-fancy",
    "parsing",
    "yaml-load"
] }

kube = { version = "3.1.0", features = ["runtime", "derive", "client", "ws"] }
k8s-openapi = { version = "0.27.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
futures = "0.3"
ginger-gitter = { path = "./ginger-gitter_client" }
lazy_static = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3.31"
tekton-sidekick = { path = "./tekton-sidekick_client" }


[package.metadata]
organization = "ginger-society"

[package.metadata.bundle]
osx_minimum_system_version = "11.0"
